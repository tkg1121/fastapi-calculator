<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello World &amp; Calculator Demo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px auto; padding: 0 20px; max-width: 600px; text-align: center; }
        .calculator { margin-top: 30px; }
        .numbers { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin: 24px 0; }
        label { display: grid; gap: 8px; text-align: left; }
        input { padding: 10px; width: 170px; font: inherit; }
        button { padding: 10px 15px; margin: 4px; font: inherit; cursor: pointer; }
        .result { display: block; margin-top: 24px; font-size: 1.15rem; font-weight: bold; min-height: 30px; }
    </style>
</head>
<body>
    <h1>Hello World</h1>
    <div class="calculator">
        <h2>Calculator</h2>
        <p>Enter two numbers, then choose an operation.</p>
        <div class="numbers">
            <label for="a">First number<input type="number" step="any" id="a" placeholder="First number"></label>
            <label for="b">Second number<input type="number" step="any" id="b" placeholder="Second number"></label>
        </div>
        <button type="button" onclick="calculate('add')">Add</button>
        <button type="button" onclick="calculate('subtract')">Subtract</button>
        <button type="button" onclick="calculate('multiply')">Multiply</button>
        <button type="button" onclick="calculate('divide')">Divide</button>
        <output class="result" id="result" role="status" aria-live="polite"></output>
    </div>
    <script>
        async function calculate(operation) {
            const first = document.getElementById('a');
            const second = document.getElementById('b');
            const result = document.getElementById('result');
            const a = first.valueAsNumber;
            const b = second.valueAsNumber;
            if (!Number.isFinite(a) || !Number.isFinite(b)) {
                result.textContent = 'Error: Enter a valid number in both fields.';
                return;
            }
            try {
                const response = await fetch('/' + operation, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({a, b})
                });
                const data = await response.json();
                result.textContent = response.ok
                    ? 'Calculation Result: ' + data.result
                    : 'Error: ' + data.error;
            } catch (error) {
                result.textContent = 'Error: Could not reach the calculator. Please try again.';
            }
        }
    </script>
</body>
</html>
